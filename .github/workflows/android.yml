name: App Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Llave de firma
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kylapse.jks"
            echo "KS_FILE=$RUNNER_TEMP/kylapse.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin llave de firma: se firma con llave de depuración"
          fi

      - name: Compilar APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: kylapse
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kylapse.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest kylapse.apk \
            --target "${{ github.sha }}" \
            --title "Kylapse para Android" \
            --notes "Versión 1.0.${{ github.run_number }}" \
            --latest
